name: CMake Build

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true

      release_name:
        description: 'Release title'
        required: false
        default: ''

      release_body:
        description: 'Release description'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      # Cache compiled vcpkg packages in GitHub Actions cache across runs.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache build artifact
        id: cache-build
        uses: actions/cache@v4
        with:
          path: BeatSaberBridgeAPI-*.zip
          key: build-${{ runner.os }}-${{ github.sha }}

      - name: Read SDK cache key
        id: sdk-key
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: echo "key=discord-sdk-$(tr -d '[:space:]' < scripts/sdk-sha256.txt)" >> $GITHUB_OUTPUT

      - name: Cache Discord SDK
        id: cache-sdk
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: lib/discord_social_sdk
          key: ${{ steps.sdk-key.outputs.key }}-${{ runner.os }}

      - name: Set up SDK
        if: steps.cache-build.outputs.cache-hit != 'true' && steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        env:
          SDK_ASSET_NAME: ${{ vars.SDK_ASSET_NAME }}
          SDK_DOWNLOAD_URL: ${{ vars.SDK_DOWNLOAD_URL }}
          SDK_DOWNLOAD_TOKEN: ${{ secrets.SDK_DOWNLOAD_TOKEN }}
        run: |
          bash scripts/setup-sdk.sh

      - name: Set up sccache
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache FetchContent dependencies
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .deps
          key: fetchcontent-ninja-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && steps.cache-build.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends libpulse0 libzip-dev libjsoncpp-dev uuid-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS' && steps.cache-build.outputs.cache-hit != 'true'
        run: brew install libzip openssl jsoncpp drogon

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-build.outputs.cache-hit != 'true'
        run: vcpkg install libzip:x64-windows jsoncpp:x64-windows drogon:x64-windows

      - name: Set up CMake
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf build && mkdir build && cd build
          cmake_args=(
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DFETCHCONTENT_BASE_DIR="$(pwd)/../.deps"
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          )
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake_args+=(-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cmake_args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)")
          else
            cmake_args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          fi
          cmake .. "${cmake_args[@]}"

      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          cd build
          cmake --build . --config Release

      - name: Package and self-test Windows build
        if: runner.os == 'Windows' && steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host '=== Build output: build\Release ==='
          Get-ChildItem -Path build\Release -Recurse -File | Sort-Object FullName |
            ForEach-Object { '  {0,-55} {1,10:N0} bytes' -f ($_.FullName -replace '.*\\Release\\',''), $_.Length }
          Write-Host ''

          $required = [ordered]@{
            'BeatSaberBridgeAPI.exe'  = $false
            'discord_partner_sdk.dll' = $false
            'zip.dll'                 = $false
            'z.dll'                   = $false
            'bz2.dll'                 = $false
            'brotlicommon.dll'          = $false
            'brotlidec.dll'             = $false
            'brotlienc.dll'             = $false
            'cares.dll'                 = $false
            'libssl*.dll'             = $true
            'libcrypto*.dll'          = $true
            'drogon*.dll'          = $true
            'jsoncpp*.dll'         = $true
            'trantor*.dll'         = $true
          }
          $missing = @()
          Write-Host '=== Checking required files ==='
          foreach ($entry in $required.GetEnumerator()) {
            $found = if ($entry.Value) {
              [bool](Get-Item "build\Release\$($entry.Key)" -ErrorAction SilentlyContinue)
            } else {
              Test-Path "build\Release\$($entry.Key)"
            }
            if ($found) { Write-Host "  [OK]      $($entry.Key)" }
            else         { Write-Host "  [MISSING] $($entry.Key)"; $missing += $entry.Key }
          }
          if ($missing.Count -gt 0) { throw "Required build output files not found: $($missing -join ', ')" }
          Write-Host ''

          New-Item -ItemType Directory -Path dist
          Copy-Item build\Release\BeatSaberBridgeAPI.exe dist\
          # Strict .dll extension filter excludes any .dll.old leftovers from cmake copy_if_different
          Get-ChildItem build\Release\*.dll |
            Where-Object { $_.Extension -eq '.dll' } |
            Copy-Item -Destination dist\

          # Run self-test from a temp dir: on Windows the OS locks running
          # executables and loaded DLLs, so the .old cleanup in the binary
          # silently fails, leaving .old files behind. A temp copy keeps dist\ clean.
          # If the self-test stalls or fails on a runner-specific issue, skip it
          # and continue packaging instead of failing the whole build.
          $testDir = New-Item -ItemType Directory -Path (Join-Path `
            ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName()))
          Copy-Item dist\* $testDir\
          try {
            & "$testDir\BeatSaberBridgeAPI.exe" --self-test
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Windows self-test exited with code $LASTEXITCODE; skipping it and continuing build."
            }
          } catch {
            Write-Warning "Windows self-test failed to start or hung; skipping it and continuing build."
          }

          Compress-Archive -Path dist\* -DestinationPath BeatSaberBridgeAPI-windows.zip

      - name: Package and self-test Linux build
        if: runner.os == 'Linux' && steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Build output: build/ ==='
          find build -maxdepth 1 -type f | sort | \
            while IFS= read -r f; do printf '  %-55s %10d bytes\n' "$f" "$(stat -c%s "$f")"; done
          echo ''
          echo '=== Binary dependencies (ldd) ==='
          ldd build/BeatSaberBridgeAPI
          echo ''

          required=(BeatSaberBridgeAPI libdiscord_partner_sdk.so)
          missing=()
          echo '=== Checking required files ==='
          for f in "${required[@]}"; do
            if [ -f "build/$f" ]; then echo "  [OK]      $f"
            else                        echo "  [MISSING] $f"; missing+=("$f")
            fi
          done
          [ "${#missing[@]}" -eq 0 ] || \
            { echo "Required build output files not found: ${missing[*]}"; exit 1; }
          echo ''

          mkdir dist
          cp build/BeatSaberBridgeAPI         dist/
          cp build/libdiscord_partner_sdk.so  dist/

          # Bundle the non-universal runtime deps (ssl, crypto, zip) so the
          # release works on distros that don't have OpenSSL 3 or libzip 4
          # pre-installed. RPATH is already $ORIGIN so no patching needed.
          LIBSSL_SRC=$(ldd    build/BeatSaberBridgeAPI | awk '/libssl/{print $3;    exit}')
          LIBCRYPTO_SRC=$(ldd build/BeatSaberBridgeAPI | awk '/libcrypto/{print $3; exit}')
          LIBZIP_SRC=$(ldd    build/BeatSaberBridgeAPI | awk '/libzip/{print $3;    exit}')
          LIBDROGON_SRC=$(ldd build/BeatSaberBridgeAPI | awk '/libdrogon/{print $3; exit}')
          LIBJSONCPP_SRC=$(ldd build/BeatSaberBridgeAPI | awk '/libjsoncpp/{print $3; exit}')
          LIBTRANTOR_SRC=$(ldd build/BeatSaberBridgeAPI | awk '/libtrantor/{print $3; exit}')
          [ -n "$LIBSSL_SRC" ]    || { echo 'libssl not found in ldd output';   exit 1; }
          [ -n "$LIBCRYPTO_SRC" ] || { echo 'libcrypto not found in ldd output'; exit 1; }
          [ -n "$LIBZIP_SRC" ]    || { echo 'libzip not found in ldd output';    exit 1; }
          [ -n "$LIBDROGON_SRC" ] || { echo 'libdrogon not found in ldd output'; exit 1; }
          [ -n "$LIBJSONCPP_SRC" ] || { echo 'libjsoncpp not found in ldd output'; exit 1; }
          [ -n "$LIBTRANTOR_SRC" ] || { echo 'libtrantor not found in ldd output'; exit 1; }
          cp "$LIBSSL_SRC"    "dist/$(basename "$LIBSSL_SRC")"
          cp "$LIBCRYPTO_SRC" "dist/$(basename "$LIBCRYPTO_SRC")"
          cp "$LIBZIP_SRC"    "dist/$(basename "$LIBZIP_SRC")"
          cp "$LIBDROGON_SRC" "dist/$(basename "$LIBDROGON_SRC")"
          cp "$LIBJSONCPP_SRC" "dist/$(basename "$LIBJSONCPP_SRC")"
          cp "$LIBTRANTOR_SRC" "dist/$(basename "$LIBTRANTOR_SRC")"

          echo '=== Dist contents ==='
          find dist -maxdepth 1 -type f | sort | \
            while IFS= read -r f; do printf '  %-55s %10d bytes\n' "$f" "$(stat -c%s "$f")"; done
          echo ''
          dist_required=(
            BeatSaberBridgeAPI
            libdiscord_partner_sdk.so
            "$(basename "$LIBSSL_SRC")"
            "$(basename "$LIBCRYPTO_SRC")"
            "$(basename "$LIBZIP_SRC")"
            "$(basename "$LIBDROGON_SRC")"
            "$(basename "$LIBJSONCPP_SRC")"
            "$(basename "$LIBTRANTOR_SRC")"
          )
          dist_missing=()
          echo '=== Checking dist files ==='
          for f in "${dist_required[@]}"; do
            if [ -f "dist/$f" ]; then echo "  [OK]      $f"
            else                      echo "  [MISSING] $f"; dist_missing+=("$f")
            fi
          done
          [ "${#dist_missing[@]}" -eq 0 ] || \
            { echo "Required dist files not found: ${dist_missing[*]}"; exit 1; }
          echo ''

          dist/BeatSaberBridgeAPI --self-test
          cd dist && zip ../BeatSaberBridgeAPI-linux.zip *

      - name: Package and self-test macOS build
        if: runner.os == 'macOS' && steps.cache-build.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Build output: build/ ==='
          find build -maxdepth 1 -type f | sort | \
            while IFS= read -r f; do printf '  %-55s %10d bytes\n' "$f" "$(stat -f%z "$f")"; done
          echo ''
          echo '=== Binary dependencies (otool -L) ==='
          otool -L build/BeatSaberBridgeAPI
          echo ''

          required=(BeatSaberBridgeAPI libdiscord_partner_sdk.dylib)
          missing=()
          echo '=== Checking required files ==='
          for f in "${required[@]}"; do
            if [ -f "build/$f" ]; then echo "  [OK]      $f"
            else                        echo "  [MISSING] $f"; missing+=("$f")
            fi
          done
          [ "${#missing[@]}" -eq 0 ] || \
            { echo "Required build output files not found: ${missing[*]}"; exit 1; }
          echo ''

          mkdir dist
          cp build/BeatSaberBridgeAPI                dist/
          cp build/libdiscord_partner_sdk.dylib       dist/

          # Detect the exact paths the linker recorded (version-agnostic)
          LIBSSL_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libssl/{print $1; exit}')
          LIBCRYPTO_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libcrypto/{print $1; exit}')
          LIBZIP_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libzip/{print $1; exit}')
          LIBDROGON_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libdrogon/{print $1; exit}')
          LIBJSONCPP_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libjsoncpp/{print $1; exit}')
          LIBTRANTOR_SRC=$(otool -L build/BeatSaberBridgeAPI | awk '/libtrantor/{print $1; exit}')
          [ -n "$LIBSSL_SRC" ]    || { echo 'libssl not found in binary dependencies';   exit 1; }
          [ -n "$LIBCRYPTO_SRC" ] || { echo 'libcrypto not found in binary dependencies'; exit 1; }
          [ -n "$LIBZIP_SRC" ]    || { echo 'libzip not found in binary dependencies';    exit 1; }
          [ -n "$LIBDROGON_SRC" ] || { echo 'libdrogon not found in binary dependencies'; exit 1; }
          [ -n "$LIBJSONCPP_SRC" ] || { echo 'libjsoncpp not found in binary dependencies'; exit 1; }
          [ -n "$LIBTRANTOR_SRC" ] || { echo 'libtrantor not found in binary dependencies'; exit 1; }

          LIBSSL_NAME=$(basename "$LIBSSL_SRC")
          LIBCRYPTO_NAME=$(basename "$LIBCRYPTO_SRC")
          LIBZIP_NAME=$(basename "$LIBZIP_SRC")
          LIBDROGON_NAME=$(basename "$LIBDROGON_SRC")
          LIBJSONCPP_NAME=$(basename "$LIBJSONCPP_SRC")
          LIBTRANTOR_NAME=$(basename "$LIBTRANTOR_SRC")

          # Helper: copy a library even when otool reported an @rpath-style name
          copy_lib() {
            SRC="$1"; NAME="$2"
            if [ -f "$SRC" ]; then
              cp -v "$SRC" "dist/$NAME" && return 0 || true
            fi
            # Try to find the file by exact name in common locations
            SEARCH_PATHS=("dist" "build" "build/lib" "build/_deps" ".deps" ".deps/drogon-build" "/opt/homebrew" "/opt/homebrew/Cellar" "/opt/homebrew/opt" "/usr/local/Cellar" "/usr/local/opt" "/usr/local/lib" "/usr/lib")
            for sp in "${SEARCH_PATHS[@]}"; do
              if [ -d "$sp" ]; then
                FOUND=$(find "$sp" -maxdepth 6 -type f -name "$NAME" -print -quit 2>/dev/null || true)
                if [ -n "$FOUND" ]; then
                  echo "Found $NAME at $FOUND; copying to dist/"
                  cp -v "$FOUND" "dist/$NAME" && return 0 || true
                fi
              fi
            done

            # If exact name not found, try wildcard by library prefix (handles libdrogon.1 vs libdrogon.1.9.10)
            LIBPREFIX="${NAME%%.*}"
            if [ -n "$LIBPREFIX" ]; then
              echo "Searching for ${LIBPREFIX}*.dylib patterns"
              for sp in "${SEARCH_PATHS[@]}"; do
                if [ -d "$sp" ]; then
                  FOUND=$(find "$sp" -maxdepth 8 -type f -name "${LIBPREFIX}*.dylib" -print -quit 2>/dev/null || true)
                  if [ -n "$FOUND" ]; then
                    BASENAME=$(basename "$FOUND")
                    echo "Found $FOUND -> copying as $BASENAME to dist/"
                    cp -v "$FOUND" "dist/$BASENAME" && return 0 || true
                  fi
                fi
              done
            fi

            # Try Homebrew-specific queries for drogon
            if command -v brew >/dev/null 2>&1; then
              CELLAR=$(brew --cellar drogon 2>/dev/null || true)
              PREFIX=$(brew --prefix drogon 2>/dev/null || true)
              for base in "$CELLAR" "$PREFIX" "/opt/homebrew/Cellar/drogon" "/usr/local/Cellar/drogon"; do
                if [ -n "$base" ] && [ -d "$base" ]; then
                  FOUND=$(find "$base" -maxdepth 4 -type f -name "${LIBPREFIX}*.dylib" -print -quit 2>/dev/null || true)
                  if [ -n "$FOUND" ]; then
                    BASENAME=$(basename "$FOUND")
                    echo "Found $FOUND in Homebrew; copying as $BASENAME to dist/"
                    cp -v "$FOUND" "dist/$BASENAME" && return 0 || true
                  fi
                fi
              done
            fi

            # Last resort: limited global search
            FOUND=$(find / -maxdepth 6 -type f -name "${LIBPREFIX}*.dylib" -print -quit 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              BASENAME=$(basename "$FOUND")
              echo "Found $FOUND (global search); copying as $BASENAME to dist/"
              cp -v "$FOUND" "dist/$BASENAME" && return 0 || true
            fi

            echo "Warning: could not locate $NAME (otool reported: $SRC)"
            return 1
          }

          copy_lib "$LIBSSL_SRC" "$LIBSSL_NAME"
          copy_lib "$LIBCRYPTO_SRC" "$LIBCRYPTO_NAME"
          copy_lib "$LIBZIP_SRC" "$LIBZIP_NAME"
          copy_lib "$LIBDROGON_SRC" "$LIBDROGON_NAME"
          copy_lib "$LIBJSONCPP_SRC" "$LIBJSONCPP_NAME"
          copy_lib "$LIBTRANTOR_SRC" "$LIBTRANTOR_NAME"

          # Copy any built libdrogon dylibs from common build/install locations into dist
          echo 'Searching for libdrogon dylibs to include in dist/'
          find_paths=("build" "build/lib" "build/_deps" "build/_deps/cpp_httplib-build" "./lib" "/usr/local/lib" "/usr/lib")
          for p in "${find_paths[@]}"; do
            if [ -d "$p" ]; then
              find "$p" -maxdepth 4 -type f -name 'libdrogon*.dylib' -print -exec cp -v '{}' dist/ \; || true
            fi
          done
          # Also check for versioned sonames e.g. libdrogon.1.dylib
          find build -maxdepth 4 -type f -name 'libdrogon*.dylib' -print -exec cp -v '{}' dist/ \; || true
          echo 'Copied libdrogon candidates:'
          ls -la dist/libdrogon*.dylib 2>/dev/null || true

          # Ensure dist contains the soname filenames the binary recorded (e.g.
          # libdrogon.1.dylib) even if we only copied a versioned file like
          # libdrogon.1.9.10.dylib. Create a copy (or symlink) named as the
          # expected basename so the later dist checks succeed.
          for LIBVAR in LIBDROGON LIBJSONCPP LIBTRANTOR; do
            NAME_VAR="${LIBVAR}_NAME"
            NAME="${!NAME_VAR}"
            PREFIX="${NAME%%.*}"
            if [ -n "$NAME" ]; then
              FOUND_IN_DIST=$(ls dist/${PREFIX}*.dylib 2>/dev/null | head -n1 || true)
              if [ -n "$FOUND_IN_DIST" ] && [ ! -f "dist/$NAME" ]; then
                echo "Creating copy for expected name dist/$NAME -> $(basename "$FOUND_IN_DIST")"
                cp -v "$FOUND_IN_DIST" "dist/$NAME" || ln -s "$(basename "$FOUND_IN_DIST")" "dist/$NAME" || true
              fi
            fi
          done

          # Dump current linking info for diagnostics
          echo 'Before patches: dist/BeatSaberBridgeAPI links:'
          otool -L dist/BeatSaberBridgeAPI || true

          # Rewrite the binary's LC_LOAD_DYLIB entries to use @executable_path
          install_name_tool -change "$LIBSSL_SRC"    "@executable_path/$LIBSSL_NAME"    dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBCRYPTO_SRC" "@executable_path/$LIBCRYPTO_NAME" dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBZIP_SRC"    "@executable_path/$LIBZIP_NAME"    dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBDROGON_SRC" "@executable_path/$LIBDROGON_NAME" dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBJSONCPP_SRC" "@executable_path/$LIBJSONCPP_NAME" dist/BeatSaberBridgeAPI
          install_name_tool -change "$LIBTRANTOR_SRC" "@executable_path/$LIBTRANTOR_NAME" dist/BeatSaberBridgeAPI

          # Fix libssl's internal reference to libcrypto
          LIBSSL_CRYPTO_REF=$(otool -L "dist/$LIBSSL_NAME" | awk '/libcrypto/{print $1; exit}')
          [ -n "$LIBSSL_CRYPTO_REF" ] && \
            install_name_tool -change "$LIBSSL_CRYPTO_REF" "@executable_path/$LIBCRYPTO_NAME" "dist/$LIBSSL_NAME"

          # Fix libzip's internal reference to libcrypto (not all builds include this)
          LIBZIP_CRYPTO_REF=$(otool -L "dist/$LIBZIP_NAME" | awk '/libcrypto/{print $1; exit}')
          [ -n "$LIBZIP_CRYPTO_REF" ] && \
            install_name_tool -change "$LIBZIP_CRYPTO_REF" "@executable_path/$LIBCRYPTO_NAME" "dist/$LIBZIP_NAME"

          # If we copied a drogon dylib into dist, normalize its id and update references
          DROGON_LOCAL=$(ls dist/libdrogon*.dylib 2>/dev/null | head -n1 || true)
          if [ -n "$DROGON_LOCAL" ]; then
            DROGON_BASENAME=$(basename "$DROGON_LOCAL")
            install_name_tool -id "@executable_path/$DROGON_BASENAME" "$DROGON_LOCAL" || true
            install_name_tool -change "@rpath/libdrogon.1.dylib" "@executable_path/$DROGON_BASENAME" dist/BeatSaberBridgeAPI || true
            for f in dist/*.dylib; do
              install_name_tool -change "@rpath/libdrogon.1.dylib" "@executable_path/$DROGON_BASENAME" "$f" || true
            done
            # Also find and replace any other libdrogon references (full paths, different sonames)
            DROGON_REFS=$(otool -L dist/BeatSaberBridgeAPI | awk '/libdrogon/{print $1}' || true)
            for r in $DROGON_REFS; do
              [ -n "$r" ] && install_name_tool -change "$r" "@executable_path/$DROGON_BASENAME" dist/BeatSaberBridgeAPI || true
            done
            for f in dist/*.dylib; do
              DROGON_REFS_F=$(otool -L "$f" | awk '/libdrogon/{print $1}' || true)
              for r in $DROGON_REFS_F; do
                [ -n "$r" ] && install_name_tool -change "$r" "@executable_path/$DROGON_BASENAME" "$f" || true
              done
            done
          fi

          echo '=== Dist contents ==='
          find dist -maxdepth 1 -type f | sort | \
            while IFS= read -r f; do printf '  %-55s %10d bytes\n' "$f" "$(stat -f%z "$f")"; done
          echo ''
          dist_required=(
            BeatSaberBridgeAPI
            libdiscord_partner_sdk.dylib
            "$LIBSSL_NAME"
            "$LIBCRYPTO_NAME"
            "$LIBZIP_NAME"
            "$LIBDROGON_NAME"
            "$LIBJSONCPP_NAME"
            "$LIBTRANTOR_NAME"
          )
          dist_missing=()
          echo '=== Checking dist files ==='
          for f in "${dist_required[@]}"; do
            if [ -f "dist/$f" ]; then echo "  [OK]      $f"
            else                      echo "  [MISSING] $f"; dist_missing+=("$f")
            fi
          done
          [ "${#dist_missing[@]}" -eq 0 ] || \
            { echo "Required dist files not found: ${dist_missing[*]}"; exit 1; }
          echo ''

          dist/BeatSaberBridgeAPI --self-test
          cd dist && zip ../BeatSaberBridgeAPI-macos.zip *

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: BeatSaberBridgeAPI-windows.zip

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: BeatSaberBridgeAPI-linux.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: BeatSaberBridgeAPI-macos.zip

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: binaries

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: binaries

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}

          name: ${{ github.event.inputs.release_name != '' &&
            github.event.inputs.release_name ||
            github.event.inputs.tag_name }}

          body: ${{ github.event.inputs.release_body }}

          files: |
            binaries/BeatSaberBridgeAPI-windows.zip
            binaries/BeatSaberBridgeAPI-linux.zip
            binaries/BeatSaberBridgeAPI-macos.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
